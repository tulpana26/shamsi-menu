<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHAMSI — меню</title>
<meta name="description" content="Меню кофейни SHAMSI: кофе, холодные напитки, лимонады, чай.">
<meta name="theme-color" content="#0b1712">
<link rel="preload" href="assets/calligraphy.png" as="image">
<link rel="preload" href="assets/fonts/PlayfairDisplay-400-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/Manrope-400-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SHAMSI">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23123024'/%3E%3Cpath d='M16 23V12M11.5 16.5a4.5 4.5 0 1 1 9 0' stroke='%23C9A55F' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<header class="topbar" id="topbar">
  <a class="brand" href="#" aria-label="SHAMSI — меню">
      <picture>
        <source srcset="assets/logo.webp" type="image/webp">
        <img class="brand__logo" src="assets/logo.png" alt="SHAMSI" width="120" height="86">
      </picture>
    </a>
  <div class="topbar__actions">
    <button class="icon-btn" id="searchBtn" aria-label="Поиск по меню">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>
    <button class="pill-btn" id="qrBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="6" height="6" rx="1"/><rect x="14.5" y="3.5" width="6" height="6" rx="1"/><rect x="3.5" y="14.5" width="6" height="6" rx="1"/><path d="M14.5 14.5h2.5v2.5h-2.5zM19 19h1.5M19 14.5h1.5M14.5 20.5h1"/></svg>
      <span>QR</span>
    </button>
  </div>
</header>

<div class="shell">

  <!-- левый сайдбар с разделами -->
  <aside class="sidebar" id="sidebar" aria-label="Разделы меню">
    <p class="sidebar__label">Разделы</p>
    <nav class="sidebar__nav" id="sidebarNav"></nav>
    <div class="sidebar__foot">
      <img class="sidebar__calli" src="assets/calligraphy.png" alt="" width="1411" height="457">
      <p class="sidebar__note">кофе · выпечка · тепло</p>
    </div>
  </aside>

  <!-- лента разделов на телефоне -->
  <nav class="chips" id="chips" aria-label="Разделы меню">
    <div class="chips__track" id="chipsTrack"></div>
  </nav>

  <main class="content" id="content" tabindex="-1"></main>

</div>

<footer class="footer">
  <img class="footer__logo" src="assets/logo.png" alt="SHAMSI" width="88" height="63">
  <span class="footer__copy">© <span id="year"></span> · кофе · выпечка · тепло</span>
</footer>

<!-- поиск -->
<div class="sheet" id="searchSheet" hidden>
  <div class="sheet__backdrop" data-close></div>
  <div class="sheet__panel sheet__panel--search" role="dialog" aria-modal="true" aria-label="Поиск по меню">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="searchInput" type="search" placeholder="капучино, урбеч, чай…" autocomplete="off" enterkeyhint="search">
      <button class="search__close" data-close aria-label="Закрыть">×</button>
    </div>
    <div class="search__results" id="searchResults"></div>
  </div>
</div>

<!-- QR -->
<div class="sheet" id="qrSheet" hidden>
  <div class="sheet__backdrop" data-close></div>
  <div class="sheet__panel sheet__panel--qr" role="dialog" aria-modal="true" aria-label="QR-код меню">
    <button class="sheet__close" data-close aria-label="Закрыть">×</button>
    <p class="qr__eyebrow">меню в телефоне</p>
    <h2 class="qr__title">Наведите камеру</h2>
    <div class="qr__frame" id="qrFrame">
      <div class="qr__spinner" id="qrSpinner">готовим код…</div>
    </div>
    <p class="qr__url" id="qrUrl"></p>
    <div class="qr__actions">
      <button class="btn btn--solid" id="copyLink">Скопировать ссылку</button>
      <button class="btn btn--ghost" id="printQr">Печать</button>
    </div>
    <p class="qr__note">распечатайте и поставьте на стол — гость откроет меню без приложения</p>
  </div>
</div>

<script src="assets/menu-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
