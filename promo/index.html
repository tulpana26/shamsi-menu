<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHAMSI — Акция</title>
<meta name="theme-color" content="#0b1712">
<meta name="description" content="Акция SHAMSI: 7 баллов = кофе, бамбл или тоник в подарок.">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23123024'/%3E%3Cpath d='M16 23V12M11.5 16.5a4.5 4.5 0 1 1 9 0' stroke='%23C9A55F' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  /* en-tête repris tel quel du menu */
  :root{--ink:#0b1712; --line:rgba(242,238,228,.09); --cream:#f2eee4; --gold:#c9a55f; --serif:"Playfair Display", Georgia, "Times New Roman", serif; --sans:"Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; --pad:clamp(16px, 4vw, 44px); --ease:cubic-bezier(.22,.61,.36,1)}
  .topbar{position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  height:66px; padding:0 var(--pad);
  background:rgba(11,23,18,.86);
  backdrop-filter:blur(14px) saturate(120%);
  border-bottom:1px solid var(--line);}
  .brand{display:inline-flex; align-items:center; gap:10px}
  .brand__logo{display:block; height:clamp(30px,4.4vw,40px); width:auto}
  .brand__name{font-family:var(--serif); font-size:18px; font-weight:500;
  letter-spacing:.32em; line-height:1; padding-left:.1em;}
  .topbar__actions{display:flex; align-items:center; gap:9px}
  .icon-btn{display:inline-flex; align-items:center; justify-content:center;
  width:40px; height:40px; border-radius:50%;
  border:1px solid rgba(242,238,228,.16);
  transition:border-color .3s var(--ease), background .3s var(--ease);}
  .icon-btn svg{width:17px; height:17px; fill:none; stroke:var(--cream); stroke-width:1.5; stroke-linecap:round}
  .icon-btn:hover{border-color:rgba(201,165,95,.6); background:rgba(201,165,95,.1)}
  .pill-btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:40px; padding:0 16px; border-radius:999px;
  border:1px solid rgba(201,165,95,.5); color:var(--gold);
  font-family:var(--sans); font-size:12px; font-weight:600;
  letter-spacing:.16em; line-height:1; text-transform:uppercase;
  transition:background .3s var(--ease), color .3s var(--ease);}
  .pill-btn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.5}
  .pill-btn:hover{background:var(--gold); color:var(--ink)}
  .pill-btn--gold{border-color:rgba(201,165,95,.55); color:var(--gold)}
  .pill-btn--gold:hover{background:var(--gold); color:var(--ink)}
@media print{
    .topbar, .shell, .footer, .qr__actions, .sheet__close, .qr__note, .qr__url{display:none !important}
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0b1712}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh; color:#f2eee4;
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(120% 70% at 50% -15%, rgba(201,165,95,.16), transparent 62%),
      radial-gradient(90% 60% at 110% 115%, rgba(18,58,42,.85), transparent 70%),
      #0b1712;
    display:flex; align-items:center; justify-content:center;
    padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  }
  .card{
    width:100%; max-width:520px; display:flex; flex-direction:column; align-items:center;
    gap:clamp(22px,5.4vw,34px); text-align:center;
  }
  .brand img{width:clamp(72px,17vw,100px); height:auto; display:block; opacity:.95}
  .eyebrow{
    margin:0; font-size:clamp(11px,2.9vw,13px); letter-spacing:.28em; text-transform:uppercase;
    color:#c9a55f; font-weight:600;
  }
  .lead{
    margin:0; font-family:"Playfair Display",Georgia,serif; color:#efd39a;
    font-size:clamp(32px,9.4vw,52px); line-height:1; font-weight:500;
  }
  .drinks{display:flex; justify-content:center; gap:clamp(16px,5.6vw,30px); width:100%; margin:0; padding:0; list-style:none}
  .drinks li{flex:1 1 0; min-width:0; max-width:104px; display:flex; flex-direction:column; align-items:center; gap:8px}
  .drinks img{
    width:100%; aspect-ratio:1; border-radius:50%; object-fit:cover; display:block;
    filter:drop-shadow(0 14px 28px rgba(0,0,0,.5));
  }
  .drinks span{
    font-size:clamp(10px,2.7vw,12px); letter-spacing:.16em; text-transform:uppercase;
    color:rgba(242,238,228,.72); font-weight:600; white-space:nowrap;
  }
  .gift{
    margin:0; font-family:"Playfair Display",Georgia,serif; color:#efd39a;
    font-size:clamp(21px,6.2vw,34px); line-height:1.1; text-transform:uppercase; letter-spacing:.02em;
  }
  .qr{
    position:relative; overflow:hidden;
    margin-top:6px; display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:clamp(16px,4.4vw,24px); border-radius:22px; width:100%;
    background:linear-gradient(160deg, rgba(201,165,95,.10), rgba(242,238,228,.03));
    border:1px solid rgba(201,165,95,.42);
    box-shadow:0 0 0 1px rgba(201,165,95,.10), 0 18px 40px rgba(0,0,0,.35);
  }
  /* блик, проходящий по карточке с QR */
  .qr::after{
    content:""; position:absolute; top:-40%; bottom:-40%; width:45%;
    background:linear-gradient(100deg, transparent, rgba(255,232,180,.16) 45%, rgba(255,232,180,.28) 50%, rgba(255,232,180,.16) 55%, transparent);
    transform:translateX(-220%) skewX(-12deg); pointer-events:none;
    animation:shine 7s ease-in-out infinite;
  }
  @keyframes shine{0%,72%{transform:translateX(-220%) skewX(-12deg)}92%,100%{transform:translateX(320%) skewX(-12deg)}}
  @media (prefers-reduced-motion: reduce){ .qr::after{animation:none; opacity:0} }
  .qr img{
    width:clamp(126px,36vw,172px); height:auto; display:block; border-radius:14px;
    background:#0b1712;
    filter:drop-shadow(0 0 12px rgba(210,166,78,.30));
  }
  .qr p{margin:0; font-size:clamp(12px,3.2vw,14px); line-height:1.5; color:rgba(242,238,228,.74); max-width:34ch}
  .qr b{color:#f2eee4; font-weight:600}
  .back{
    color:rgba(242,238,228,.42); text-decoration:none; font-size:11px; letter-spacing:.18em;
    text-transform:uppercase; padding:6px 2px; border-bottom:1px solid rgba(242,238,228,.16);
  }
  .back:hover{color:#c9a55f; border-color:#c9a55f}
  /* планшеты и горизонтальные телефоны: текст слева, QR справа */
  @media (min-width:760px){
    .card{
      /* планшет: info и QR стоят рядом и центрируются как одна пара */
      max-width:1040px; display:grid; grid-template-columns:max-content max-content;
      justify-content:center; align-items:center;
      text-align:left; column-gap:clamp(16px,2.5vw,32px); row-gap:clamp(12px,2vw,20px);
    }
    .card__info{display:flex; flex-direction:column; gap:clamp(12px,2vw,20px); align-items:flex-start; justify-self:end}
    .drinks{justify-content:flex-start}
    .drinks li{max-width:118px}
    .qr{grid-column:2; grid-row:2; width:auto; justify-self:start; max-width:300px}
    .card__info{grid-column:1; grid-row:2}
    .back{grid-column:1 / -1; grid-row:3; justify-self:start; margin-top:8px}
  }
  /* la page était un flex en ligne centré : la barre se retrouvait à côté de la
     carte. On passe en colonne : barre en haut sur toute la largeur, carte centrée
     dans l'espace restant. */
  body{display:flex; flex-direction:column; align-items:center; justify-content:flex-start}
  .topbar{flex:0 0 auto; align-self:stretch; width:auto;
    margin:calc(-18px - env(safe-area-inset-top)) -18px 0}
  .card{flex:1 1 auto; margin:auto 0}
</style>
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="../" aria-label="SHAMSI — меню">
      <picture>
        <source srcset="../assets/logo.webp" type="image/webp">
        <img class="brand__logo" src="../assets/logo.png" alt="SHAMSI" width="120" height="86">
      </picture>
    </a>
    <div class="topbar__actions">
      <button class="icon-btn" id="searchBtn" aria-label="Поиск по меню">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
    </div>
  </header>

  <main class="card">
<div class="card__info">
      <p class="eyebrow">Акция</p>
      <h1 class="lead">7 баллов =</h1>
      <ul class="drinks">
        <li><img src="../assets/promo/coffee.webp" alt="Кофе" loading="eager" decoding="async"><span>кофе</span></li>
        <li><img src="../assets/promo/bumble.webp" alt="Бамбл" loading="eager" decoding="async"><span>бамбл</span></li>
        <li><img src="../assets/promo/tonic.webp" alt="Тоник" loading="eager" decoding="async"><span>тоник</span></li>
      </ul>
      <p class="gift">в подарок!</p>
    </div>

    <div class="qr">
      <img src="../assets/promo-qr.png?v=2" alt="QR-код бота SHAMSI" width="490" height="490">
      <p>Сканируй QR, заходи в бота <b>@shamsiclientsbot</b> и копи баллы с каждой покупки.</p>
    </div>

    <a class="back" href="../">← меню</a>
  </main>
</body>
</html>
