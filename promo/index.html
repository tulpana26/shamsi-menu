<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHAMSI — Акция</title>
<meta name="theme-color" content="#0b1712">
<meta name="description" content="Акция SHAMSI: 7 баллов = кофе, бамбл или тоник в подарок.">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23123024'/%3E%3Cpath d='M16 23V12M11.5 16.5a4.5 4.5 0 1 1 9 0' stroke='%23C9A55F' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0b1712}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh; color:#f2eee4;
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(120% 70% at 50% -15%, rgba(201,165,95,.16), transparent 62%),
      radial-gradient(90% 60% at 110% 115%, rgba(18,58,42,.85), transparent 70%),
      #0b1712;
    display:flex; align-items:center; justify-content:center;
    padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  }
  .card{
    width:100%; max-width:520px; display:flex; flex-direction:column; align-items:center;
    gap:clamp(14px,3.4vw,22px); text-align:center;
  }
  .brand img{width:clamp(84px,20vw,116px); height:auto; display:block; opacity:.95}
  .eyebrow{
    margin:0; font-size:clamp(11px,2.9vw,13px); letter-spacing:.28em; text-transform:uppercase;
    color:#c9a55f; font-weight:600;
  }
  .lead{
    margin:0; font-family:"Playfair Display",Georgia,serif; color:#efd39a;
    font-size:clamp(38px,11.5vw,64px); line-height:1; font-weight:500;
  }
  .drinks{display:flex; justify-content:center; gap:clamp(8px,3.2vw,18px); width:100%; margin:0; padding:0; list-style:none}
  .drinks li{flex:1 1 0; min-width:0; max-width:132px; display:flex; flex-direction:column; align-items:center; gap:8px}
  .drinks img{
    width:100%; aspect-ratio:1; border-radius:50%; object-fit:cover; display:block;
    border:1px solid rgba(201,165,95,.5);
    box-shadow:0 0 0 5px rgba(201,165,95,.07), 0 14px 30px rgba(0,0,0,.45);
    background:#10251b;
  }
  .drinks span{
    font-size:clamp(10px,2.7vw,12px); letter-spacing:.16em; text-transform:uppercase;
    color:rgba(242,238,228,.72); font-weight:600; white-space:nowrap;
  }
  .gift{
    margin:0; font-family:"Playfair Display",Georgia,serif; color:#efd39a;
    font-size:clamp(26px,7.6vw,42px); line-height:1.05; text-transform:uppercase; letter-spacing:.02em;
  }
  .qr{
    margin-top:4px; display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:clamp(12px,3.4vw,18px); border-radius:22px; width:100%;
    background:rgba(242,238,228,.05); border:1px solid rgba(201,165,95,.28);
  }
  .qr img{width:clamp(150px,44vw,210px); height:auto; display:block; border-radius:12px; background:#0b1712}
  .qr p{margin:0; font-size:clamp(12px,3.2vw,14px); line-height:1.5; color:rgba(242,238,228,.74); max-width:34ch}
  .qr b{color:#f2eee4; font-weight:600}
  .back{
    color:rgba(242,238,228,.42); text-decoration:none; font-size:11px; letter-spacing:.18em;
    text-transform:uppercase; padding:6px 2px; border-bottom:1px solid rgba(242,238,228,.16);
  }
  .back:hover{color:#c9a55f; border-color:#c9a55f}
  /* планшеты и горизонтальные телефоны: текст слева, QR справа */
  @media (min-width:760px){
    .card{
      max-width:1040px; display:grid; grid-template-columns:1fr auto; align-items:center;
      text-align:left; gap:clamp(24px,4vw,56px);
    }
    .card__info{display:flex; flex-direction:column; gap:clamp(12px,2vw,20px); align-items:flex-start}
    .drinks{justify-content:flex-start}
    .drinks li{max-width:150px}
    .brand{grid-column:1 / -1; grid-row:1; justify-self:start}
    .qr{grid-column:2; grid-row:2; width:auto; justify-self:end; max-width:300px}
    .card__info{grid-column:1; grid-row:2}
    .back{grid-column:1 / -1; grid-row:3; justify-self:start; margin-top:8px}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="../assets/logo.png" alt="SHAMSI"></div>

    <div class="card__info">
      <p class="eyebrow">Акция</p>
      <h1 class="lead">7 баллов =</h1>
      <ul class="drinks">
        <li><img src="../assets/photos/p01-03.jpg" alt="Кофе" loading="eager"><span>кофе</span></li>
        <li><img src="../assets/photos/p02-05.jpg" alt="Бамбл" loading="eager"><span>бамбл</span></li>
        <li><img src="../assets/photos/tonic.jpg" alt="Тоник" loading="eager"><span>тоник</span></li>
      </ul>
      <p class="gift">в подарок!</p>
    </div>

    <div class="qr">
      <img src="../assets/promo-qr.png" alt="QR-код бота SHAMSI" width="490" height="490">
      <p>Сканируй QR, заходи в бота <b>@shamsiclientsbot</b> и копи баллы с каждой покупки.</p>
    </div>

    <a class="back" href="../">← меню</a>
  </main>
</body>
</html>
